name: Voice Enhancer Companion Mod

on:
  push:
    branches:
      - feature/voice-enhancer
    paths:
      - "voice-enhancer-mod/**"
      - ".github/workflows/voice-enhancer-mod.yml"
  pull_request:
    paths:
      - "voice-enhancer-mod/**"
      - ".github/workflows/voice-enhancer-mod.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build companion mod
        run: ./gradlew -p voice-enhancer-mod build
